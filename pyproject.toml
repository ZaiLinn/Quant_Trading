[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "Lean quant trading framework: data, backtest, analysis, optimization, paper/live trading"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "tabulate>=0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
ashare = ["akshare>=1.14"]
crypto = ["ccxt>=4.3"]
live = ["APScheduler>=3.10,<4"]
dev = ["pytest>=8"]

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
